<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Forgot Password - Uplabdh Nidhi Limited</title>
  <meta name="description" content="Reset your Uplabdh Nidhi Limited password or retrieve your username." />
  <meta name="keywords" content="Uplabdh Nidhi Limited, Forgot Password, Reset, Login Help" />

  <!-- Outfit Font -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- Bootstrap & Icons -->
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />

  <!-- Custom Styles -->
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
      background-color: #f8f9fa;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .forgot-container {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 420px;
      width: 100%;
    }

    .forgot-container h2 {
      font-weight: 600;
      font-size: 24px;
      text-align: center;
      margin-bottom: 10px;
    }

    .forgot-container p {
      font-size: 15px;
      text-align: center;
      margin-bottom: 1.5rem;
      color: #666;
    }

    .form-label {
      font-weight: 500;
    }

    .form-control {
      border-radius: 10px;
      padding: 0.75rem;
      font-size: 15px;
    }

    .btn-submit {
      background-color: #e59d02;
      border: none;
      color: #fff;
      font-weight: 500;
      border-radius: 10px;
      padding: 0.65rem;
      transition: background-color 0.3s ease;
    }

    .btn-submit:hover {
      background-color: #cc8a00;
    }
  </style>
</head>

<body>
  <div class="forgot-container">
    <h2>Forgot Password</h2>
    <p>Enter your registered email address or username to reset your password.</p>
    <form>
      <div class="mb-3">
        <label for="email" class="form-label">Email or Username</label>
        <input type="email" class="form-control" id="email" placeholder="Enter email or username" />
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-submit">Send Reset Link</button>
      </div>
    </form>
  </div>
</body>
</html>
