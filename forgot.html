<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - Uplabdh</title>
  <link href="assets/img/favicon.ico" rel="icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --background-color: #f5f7fa;
      --heading-color: #191919;
      --accent-color: #e59d02;
      --surface-color: #ffffff;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--background-color);
      color: var(--heading-color);
      margin: 0;
      overflow-x: hidden;
    }

    section {
      background-image: url("assets/img/login2.png");
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .login-box {
      background-color: var(--surface-color);
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-wrap: wrap;
      max-width: 960px;
      width: 100%;
      overflow: hidden;
    }

    .login-left {
      padding: 30px;
      flex: 1;
      min-width: 300px;
    }

    .login-right {
      flex: 1;
      background: linear-gradient(120deg, #f7f7f7, #e6e6e6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h2 {
      font-weight: 700;
      font-size: 28px;
      margin-bottom: 20px;
    }

    label {
      font-weight: 500;
      margin-top: 15px;
      display: block;
    }

    /* DIFFERENT INPUT STYLE */
    .form-control {
      border: none;
      border-bottom: 2px solid #ccc;
      border-radius: 0;
      padding: 10px 5px;
      background: transparent;
      box-shadow: none;
      transition: border-color 0.3s;
    }

    .form-control:focus {
      border-color: var(--accent-color);
      background-color: transparent;
      outline: none;
    }

    .btn-login {
      margin-top: 25px;
      background-color: var(--accent-color);
      border: none;
      color: white;
      padding: 12px 0;
      font-weight: 600;
      border-radius: 10px;
      width: 100%;
      transition: 0.3s;
    }

    .btn-login:hover {
      background-color: #cc8900;
    }

    .captcha-box {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
    }

    .captcha-display {
      padding: 10px 15px;
      background-color: #eee;
      font-weight: bold;
      border-radius: 6px;
      color: #333;
    }

    .forgot-links {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 14px;
    }

    .forgot-links a {
      color: var(--accent-color);
      text-decoration: none;
    }

    .login-right img {
      max-width: 100%;
      border-radius: 15px;
    }

    @media (max-width: 768px) {
      .login-box {
        flex-direction: column-reverse;
      }

      .login-left,
      .login-right {
        padding: 20px;
      }
    }
    .form-control:focus{
        box-shadow: none !important;
    }
  </style>
</head>

<body>
  <section>
    <div class="login-box">
      <!-- Left -->
      <div class="login-left">
        <img src="assets/img/Uplabdh--logo.png" class="img-fluid mb-3" style="max-width: 135px;">
        <h2>Recover Access</h2>

        <form>
          <label for="customer-id">Customer ID</label>
          <input type="text" id="customer-id" class="form-control" placeholder="Your Customer ID">

          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Your Username">

          <label for="captcha">Captcha</label>
          <div class="captcha-box">
            <input type="text" id="captcha" class="form-control" placeholder="Enter Captcha">
            <div class="captcha-display">7291</div>
          </div>

          <button class="btn btn-login" type="submit">Recover</button>

          <div class="forgot-links">
            <a href="forgot.html">Forgot Username?</a>
            <a href="forgot.html">Forgot Password?</a>
          </div>

          <div class="mt-3 text-center">
            <p class="mb-0">Back to <a href="net-banking.html" class="text-secondary">Login</a></p>
          </div>
        </form>
      </div>

      <!-- Right -->
      <div class="login-right">
        <img src="assets/img/LoginImage.webp" alt="Login Illustration">
      </div>
    </div>
  </section>
</body>

</html>
